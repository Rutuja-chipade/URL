<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Password - Shortify Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand"><div class="logo-icon">⚡</div><span>Shortify Pro</span></a>
            <div class="navbar-nav"><div id="authNav"></div><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button></div>
        </div>
    </nav>

    <div class="container" style="max-width: 600px; padding-top: 40px; padding-bottom: 40px;">
        <h2 style="margin-bottom: 8px;">🔒 Configure Password Protection</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">URL Code: <strong style="color:var(--primary);">{{ short_code }}</strong></p>

        <div class="glass-card" style="padding: 24px; border-radius: var(--radius-lg); background: var(--bg-secondary);">
            <form id="passwordConfigForm" onsubmit="handleSavePassword(event)">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display:block; margin-bottom:8px;">New Password (leave blank to remove protection)</label>
                    <input type="text" id="configPassword" class="glass-input" style="width: 100%; padding: 12px; border: 2px solid var(--border-light); border-radius: var(--radius-sm); font-size: 1rem;" placeholder="Enter secure password">
                </div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary" id="savePwBtn" style="flex:1;">Save Password</button>
                    <a href="/dashboard" class="btn btn-secondary" style="flex:1; text-align:center;">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const shortCode = "{{ short_code }}";
        async function handleSavePassword(e) {
            e.preventDefault();
            const btn = document.getElementById('savePwBtn');
            setLoading(btn, true);
            const pwd = document.getElementById('configPassword').value;
            const data = { password: pwd ? pwd : null };

            try {
                const res = await fetch(`/api/url/${shortCode}/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if(!res.ok) throw new Error(json.detail || 'Error');
                showToast(json.message, 'success');
                setTimeout(() => window.location.href = '/dashboard', 1000);
            } catch(err) {
                showToast(err.message, 'error');
            } finally {
                setLoading(btn, false);
            }
        }
    </script>
</body>
</html>
