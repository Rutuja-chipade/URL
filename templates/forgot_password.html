<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Forgot Password - Shortify Pro">
    <title>Forgot Password – Shortify Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚡</text></svg>">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <div class="logo-icon">⚡</div>
                <span>Shortify Pro</span>
            </a>
            <div class="navbar-nav">
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            </div>
        </div>
    </nav>

    <!-- Forgot Password Form -->
    <div class="auth-page">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p class="auth-subtitle">Enter your email to receive a password reset link.</p>

            <form onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary" id="forgotBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <div class="spinner"></div>
                </button>
            </form>
            
            <!-- Demo fallback for local project -->
            <div id="demoLinkContainer" style="display:none; margin-top: 20px; padding: 12px; border-radius: 8px; background: rgba(46, 213, 115, 0.1); border: 1px solid rgba(46, 213, 115, 0.3);">
                <p style="font-size: 0.85rem; color: var(--success); margin-bottom: 8px;"><b>Demo Mode:</b> A real app would email this. Click the link below to reset:</p>
                <a id="demoResetLink" href="#" style="font-size: 0.85rem; color: var(--success); word-wrap: break-word;"></a>
            </div>

            <div class="auth-footer" style="margin-top:20px;">
                Remembered? <a href="/login">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        async function handleForgotPassword(e) {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            setLoading(btn, true);

            const email = document.getElementById('forgotEmail').value.trim();

            try {
                const res = await apiPost('/api/auth/forgot-password', { email });
                if (res.demo_link) {
                    const c = document.getElementById('demoLinkContainer');
                    const a = document.getElementById('demoResetLink');
                    c.style.display = 'block';
                    a.href = res.demo_link;
                    a.textContent = window.location.origin + res.demo_link;
                } else {
                    showToast(res.message, 'success');
                }
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                setLoading(btn, false);
            }
        }
    </script>
</body>
</html>
