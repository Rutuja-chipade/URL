<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Forgot Password - Shortify Pro">
    <title>Forgot Password – Shortify Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚡</text></svg>">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <div class="logo-icon">⚡</div>
                <span>Shortify Pro</span>
            </a>
            <div class="navbar-nav">
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            </div>
        </div>
    </nav>

    <!-- Forgot Password Form -->
    <div class="auth-page">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p class="auth-subtitle">Enter your email to receive a password reset link.</p>

            <form onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary" id="forgotBtn" style="width: 100%;">
                    <span class="btn-text">Send Reset Link</span>
                    <div class="spinner"></div>
                </button>
            </form>
            
            <div id="successMessage" style="display:none; margin-top: 20px; padding: 16px; border-radius: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); text-align: center;">
                <div style="font-size: 2rem; margin-bottom: 10px;">✉️</div>
                <h4 style="color: var(--success); margin-bottom: 8px;">Check Your Email</h4>
                <p style="font-size: 0.9rem; color: var(--text-secondary);">If that email is registered, we've sent a secure reset link to your inbox.</p>
            </div>

            <div class="auth-footer" style="margin-top:20px;">
                Remembered? <a href="/login">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        async function handleForgotPassword(e) {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            const form = e.target;
            setLoading(btn, true);

            const email = document.getElementById('forgotEmail').value.trim();

            try {
                const res = await apiPost('/api/auth/forgot-password', { email });
                
                // Hide form and show success message
                form.style.display = 'none';
                document.querySelector('.auth-subtitle').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                
                if (res.demo_link) {
                    console.log("Demo reset link:", window.location.origin + res.demo_link);
                }
                
                showToast('Email sent successfully!', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                setLoading(btn, false);
            }
        }
    </script>
</body>
</html>
