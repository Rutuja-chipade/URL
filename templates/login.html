<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Shortify Pro to manage your shortened URLs and view analytics.">
    <title>Login – Shortify Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚡</text></svg>">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <div class="logo-icon">⚡</div>
                <span>Shortify Pro</span>
            </a>
            <div class="navbar-nav">
                <div id="authNav"></div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="auth-page">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your dashboard</p>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label for="loginPassword" style="margin-bottom:0;">Password</label>
                        <a href="/forgot-password" style="font-size:0.85rem; color:var(--primary);">Forgot Password?</a>
                    </div>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required minlength="6" style="margin-top:8px;">
                    <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="showPassword" onclick="togglePasswordVisibility('loginPassword')" style="width: auto; cursor: pointer;">
                        <label for="showPassword" style="font-size: 0.85rem; cursor: pointer; color: var(--text-secondary);">Show Password</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Sign In</span>
                    <div class="spinner"></div>
                </button>

            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Create one</a>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
