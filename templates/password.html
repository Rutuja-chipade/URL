<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Link – Shortify Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚡</text></svg>">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <div class="logo-icon">⚡</div>
                <span>Shortify Pro</span>
            </a>
            <div class="navbar-nav">
                <div id="authNav"></div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            </div>
        </div>
    </nav>

    <!-- Password Form -->
    <div class="auth-page">
        <div class="auth-card">
            <div style="text-align:center; margin-bottom:24px;">
                <div style="width:64px;height:64px;background:rgba(124,58,237,0.1);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 16px;">🔒</div>
                <h2>Protected Link</h2>
                <p class="auth-subtitle">This link requires a password to access</p>
            </div>

            <form id="passwordForm" onsubmit="handlePasswordSubmit(event)">
                <div class="form-group">
                    <label for="linkPassword">Enter Password</label>
                    <input type="password" id="linkPassword" placeholder="Enter the link password" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" id="verifyBtn">
                    <span class="btn-text">🔓 Unlock Link</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div style="text-align:center; margin-top:20px;">
                <a href="/" style="font-size:0.9rem; color:var(--text-secondary);">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const shortCode = '{{ short_code }}';

        async function handlePasswordSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('verifyBtn');
            setLoading(btn, true);

            const password = document.getElementById('linkPassword').value;

            try {
                const res = await fetch(`/api/verify-password/${shortCode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showToast(data.detail || 'Wrong password', 'error');
                    return;
                }

                showToast('Access granted! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = data.original_url;
                }, 500);
            } catch (err) {
                showToast('Failed to verify password', 'error');
            } finally {
                setLoading(btn, false);
            }
        }
    </script>
</body>
</html>
