<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset Password - Shortify Pro">
    <title>Reset Password – Shortify Pro</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚡</text></svg>">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <div class="logo-icon">⚡</div>
                <span>Shortify Pro</span>
            </a>
            <div class="navbar-nav">
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            </div>
        </div>
    </nav>

    <!-- Reset Password Form -->
    <div class="auth-page">
        <div class="auth-card">
            <h2>Create New Password</h2>
            <p class="auth-subtitle">Enter your new secure password below.</p>

            <form onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Must be at least 6 characters" required minlength="6">
                    <div class="password-rules">
                        <div class="password-rules-title">Password Requirements:</div>
                        <div id="rule-length" class="rule-item invalid"><i></i> At least 6 characters</div>
                        <div id="rule-upper" class="rule-item invalid"><i></i> One uppercase letter</div>
                        <div id="rule-symbol" class="rule-item invalid"><i></i> One special symbol</div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="resetBtn">
                    <span class="btn-text">Reset Password</span>
                    <div class="spinner"></div>
                </button>
            </form>
            
            <div class="auth-footer" style="margin-top:20px;">
                <a href="/login">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        async function handleResetPassword(e) {
            e.preventDefault();
            
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            if(!token) {
                showToast('Invalid or missing reset token', 'error');
                return;
            }

            const btn = document.getElementById('resetBtn');
            setLoading(btn, true);

            const new_password = document.getElementById('newPassword').value;

            try {
                const res = await apiPost('/api/auth/reset-password', { token, new_password });
                showToast(res.message, 'success');
                setTimeout(() => window.location.href = '/login', 2000);
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                setLoading(btn, false);
            }
        }
    </script>
</body>
</html>
